name: "🐛 Bug Report"
description: "Report a defect in existing functionality."
title: "[Bug]: "
labels: ["needs-triage"]
type: "Bug"
projects: ["musher-dev/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
