name: "💡 Feature Request"
description: "A capability that does not exist yet. Problem first, solution second."
title: "[Feature]: <desired outcome>"
labels: ["needs-triage"]
type: "Feature"
projects: ["musher-dev/1"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: >-
        What user pain does this address, and why now? A feature with no named pain is a solution looking for a
        problem.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Desired Outcome"
      description: "The specific, measurable result once this ships. What can a user do that they cannot do today?"
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: "Non-Goals (out of scope)"
      description: "Explicitly state what should NOT be built. An unstated boundary is an invitation to scope creep."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "Testable conditions. Each must be checkable by someone who didn't write the code."
      value: "- [ ] "
    validations:
      required: true
